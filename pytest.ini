[pytest]
# Root test discovery
testpaths = tests

# Verbose by default; short traceback keeps output readable
addopts = -v --tb=short

# Markers so tests can be selected by layer
markers =
    api: FastAPI router and middleware tests (no external services required)
    training: Data pipeline unit tests (no network or GPU required)
    e2e: End-to-end tests requiring a live API + Redis (slow)
